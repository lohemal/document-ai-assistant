name: 검사

# 평소 push 와 PR 에서 도는 검사. **시크릿을 하나도 쓰지 않는다.**
# 서명 키가 등록되지 않은 상태에서도 그대로 통과해야 한다.
#
# 설치 파일을 만들거나 서명하는 일은 여기서 하지 않는다. 그건 태그를 올렸을 때
# `릴리스 만들기`(release.yml) 가 한다.
on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Node 준비
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Rust 준비
        uses: dtolnay/rust-toolchain@stable

      - name: Rust 빌드 캐시
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: 의존성 설치
        run: npm ci

      # 배포가 조용히 깨지는 경우 — 세 파일의 버전 어긋남, 산출물 이름에 한글,
      # 업데이터 설정이 저장소와 어긋남.
      - name: 배포 이름·버전 검사
        run: npm run check:model

      # 이 프로젝트에서 가장 중요한 검사.
      # 원문 문장 -> 추출 텍스트 -> 쪽 번호 -> 문자 위치가 서로 맞는지 본다.
      - name: PDF 추출 검사
        run: npm run check:pdf

      # 청크가 가리키는 자리가 실제 pdf.js 항목으로 이어지는지 — 형광펜의 근거.
      - name: 청크·위치 검사
        run: npm run check:chunk

      # 검색 시험은 `test/search/chunks.json` 을 읽는다. 나누는 규칙을 고치고
      # 이 파일을 다시 만들지 않으면, 검색 시험이 **옛 청크**를 보면서 통과한다.
      # 그래서 다시 만들어 보고 달라지면 여기서 막는다.
      - name: 내보낸 청크가 최신인지
        shell: bash
        run: |
          npm run fixtures:chunks
          git diff --exit-code -- test/search/chunks.json \
            || { echo "::error::test/search/chunks.json 이 낡았습니다. npm run fixtures:chunks 를 돌리고 커밋하세요."; exit 1; }

      # 실제 업무자료(골든 셋)도 같은 검사를 받는다. 청크가 낡으면 검색 품질
      # 시험이 옛 청크를 보면서 통과한다.
      - name: 골든 셋 청크가 최신인지
        shell: bash
        run: |
          npm run golden:analyze
          npm run golden:build
          git diff --exit-code -- test/golden/chunks.json test/golden/golden.json \
            || { echo "::error::test/golden 의 청크가 낡았습니다. npm run golden:analyze 와 npm run golden:build 를 돌리고 커밋하세요."; exit 1; }

      # 정답 문장이 실제 PDF 의 그 자리에 있는지 — 근거 표시가 거짓이 아닌지 본다
      - name: 골든 셋 근거 위치 검사
        run: npm run check:golden

      - name: 타입 검사 · 화면 빌드
        run: npm run build

      - name: 서버 테스트
        run: cargo test --lib
        working-directory: src-tauri
