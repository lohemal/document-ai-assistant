[package]
name = "docaid"
version = "0.1.0"
description = "Document AI Assistant"
authors = ["lohemal"]
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "docaid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled", "chrono", "backup"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
log = "0.4"
tauri-plugin-updater = "2.11.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
